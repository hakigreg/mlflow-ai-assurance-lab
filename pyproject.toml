[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mlflow-ai-assurance-lab"
version = "0.0.0"
description = "Deterministic offline MLflow AI assurance lab project"
readme = "README.md"
requires-python = ">=3.12.16,<3.13"
license = "MIT"
authors = [{ name = "Repository contributors" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "mlflow==3.17.2",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pyyaml>=6.0.3,<7",
  "ruff>=0.14,<0.15",
  "types-pyyaml>=6.0.12.20250915,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mlflow_ai_assurance_lab"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
