name: Assurance gap
description: Report a sanitized gap in a risk, control, evaluation, or evidence chain.
title: "[Assurance gap]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Use synthetic or sanitized evidence only. Concrete vulnerabilities must follow SECURITY.md, not this public form.
  - type: input
    id: risk_control
    attributes:
      label: Risk and control
      description: Existing risk/control IDs, or state that the gap is not yet mapped.
    validations:
      required: true
  - type: textarea
    id: observed_gap
    attributes:
      label: Observed gap
      description: Describe the measured or reviewable gap without making unsupported conclusions.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Run, case, or evidence reference
      description: Provide sanitized identifiers and the commands used to observe the gap.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Assurance impact
      options:
        - Traceability gap
        - Control coverage gap
        - Evaluation or threshold gap
        - Evidence integrity gap
        - Residual-risk documentation gap
    validations:
      required: true
  - type: textarea
    id: reproducibility
    attributes:
      label: Reproducibility
      description: State whether the gap is deterministic and provide safe reproduction details.
    validations:
      required: true
  - type: textarea
    id: treatment
    attributes:
      label: Proposed treatment
      description: Suggest mitigation, acceptance, transfer, or further investigation without presenting it as completed.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safe disclosure confirmation
      options:
        - label: The report contains only synthetic or sanitized, non-security-sensitive material.
          required: true
